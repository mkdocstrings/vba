name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt .
          python -m pip check
          python -c "from importlib.util import find_spec; assert find_spec('material') is None"
      - name: Build documentation
        run: python -I -m zensical build --clean --strict
      - name: Check documentation
        run: python -m test.check_docs docs/site
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs/site/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment is current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine the current master commit."
            exit 1
          fi
          if [[ "$GITHUB_SHA" == "$latest_sha" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping outdated documentation for $GITHUB_SHA; master is $latest_sha."
          fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
