name: Build distributions

on: [push, pull_request]

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group build
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  installed:
    needs: build
    name: ${{ matrix.builder }} / mkdocstrings ${{ matrix.mkdocstrings }} / ${{ matrix.distribution }}
    strategy:
      fail-fast: false
      matrix:
        distribution: ['whl', 'tar.gz']
        environment: ['mkdocs', 'zensical-0.30.1', 'zensical-1.0.7']
        include:
          - environment: mkdocs
            builder: mkdocs
            mkdocstrings: '1.0.7'
            pymdown: '>=12.2'
          # Compatibility workaround for mkdocstrings 0.30.1:
          # Its Highlighter cannot construct PyMdown >=12.2.
          # Zensical requires >=11; remove the upper bound when dropping 0.30.1.
          - environment: zensical-0.30.1
            builder: zensical
            mkdocstrings: '0.30.1'
            pymdown: '>=11,<12.2'
          - environment: zensical-1.0.7
            builder: zensical
            mkdocstrings: '1.0.7'
            pymdown: '>=12.2'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install distribution and handler dependencies
        run: |
          python -m pip install dist/*.${{ matrix.distribution }} \
            "mkdocstrings==${{ matrix.mkdocstrings }}" \
            "pymdown-extensions${{ matrix.pymdown }}"
          python -m pip check
          python -c "from importlib.util import find_spec; assert find_spec('material') is None"
      - name: Install MkDocs Material
        if: matrix.builder == 'mkdocs'
        run: python -m pip install "mkdocs-material>=9.2,<10"
      - name: Install Zensical without Material
        if: matrix.builder == 'zensical'
        run: |
          python -m pip install zensical==0.0.70
          python -c "from importlib.util import find_spec; assert find_spec('material') is None"
      - name: Build and check examples outside checkout
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          cp -R examples "$RUNNER_TEMP/examples"
          cp test/site_checks.py "$RUNNER_TEMP/check_sites.py"
          cd "$RUNNER_TEMP"
          for example in example1 example2 example3
          do
            (cd "examples/$example" && python -I -m "$BUILDER" build --strict)
          done
          python -I check_sites.py examples --builder "$BUILDER" --installed
          python -m pip check
