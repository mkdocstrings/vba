name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    strategy:
      matrix:
        include:
          # Compatibility workaround for mkdocstrings 0.30.0 and 0.30.1:
          # PyMdown >=12.2 changes the Highlight constructor these versions use.
          # Remove their <12.2 bounds when dropping support for these versions.
          - mkdocstrings: '0.30.0'
            griffe: '1.12.1'
            material: '9.2.1'
            pymdown: '<12.2'
          - mkdocstrings: '0.30.1'
            griffe: '1.12.1'
            material: '9.2.1'
            pymdown: '<12.2'
          - mkdocstrings: '1.0.7'
            griffe: '1.12.1'
            material: '9.2.1'
            pymdown: '>=12.2'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
        timeout-minutes: 10

      - name: Install dependencies
        run: |
          python -m pip install ".[material]" \
            "mkdocstrings==${{ matrix.mkdocstrings }}" \
            "griffe==${{ matrix.griffe }}" \
            "mkdocs-material==${{ matrix.material }}" \
            "pymdown-extensions${{ matrix.pymdown }}"
          python -m pip check
        timeout-minutes: 10

      - name: Test
        run: |
          python -m unittest
        timeout-minutes: 60
