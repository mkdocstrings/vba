name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Python ${{ matrix.python }} / mkdocstrings ${{ matrix.mkdocstrings }} / Griffe ${{ matrix.griffe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compatibility workaround for mkdocstrings 0.30.0 and 0.30.1:
          # PyMdown >=12.2 changes the Highlight constructor these versions use.
          # Remove their <12.2 bounds when dropping support for these versions.
          - python: '3.9'
            mkdocstrings: '0.30.0'
            griffe: '==1.3.1'
            material: '==9.2.1'
            pymdown: '<12.2'
          - python: '3.11'
            mkdocstrings: '0.30.0'
            griffe: '==1.12.1'
            material: '==9.2.1'
            pymdown: '<12.2'
          - python: '3.11'
            mkdocstrings: '0.30.1'
            griffe: '==1.12.1'
            material: '==9.2.1'
            pymdown: '<12.2'
          - python: '3.11'
            mkdocstrings: '1.0.7'
            griffe: '>=1.3.1,<2'
            material: '>=9.2,<10'
            pymdown: '>=12.2'
          - python: '3.12'
            mkdocstrings: '1.0.7'
            griffe: '>=1.3.1,<2'
            material: '>=9.2,<10'
            pymdown: '>=12.2'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
        timeout-minutes: 10

      - name: Install dependencies
        run: |
          python -m pip install ".[material]" \
            "mkdocstrings==${{ matrix.mkdocstrings }}" \
            "griffe${{ matrix.griffe }}" \
            "mkdocs-material${{ matrix.material }}" \
            "pymdown-extensions${{ matrix.pymdown }}"
          python -m pip check
        timeout-minutes: 10

      - name: Test
        run: |
          python -m unittest
        timeout-minutes: 10
