[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocstrings-vba"
dynamic = ["version"]
description = "MkDocstrings VBA handler"
readme = "README.md"
requires-python = ">=3.9"
license = "ISC"
license-files = ["LICENSE"]
authors = [{name = "Rudolf Byker", email = "rudolfbyker@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mkdocstrings>=0.30,<2",
    "griffe>=1.3.1,<2",
]

[project.optional-dependencies]
material = ["mkdocs-material>=9.2,<10"]

[project.urls]
Homepage = "https://mkdocstrings.github.io/vba/"
Repository = "https://github.com/mkdocstrings/vba"
Issues = "https://github.com/mkdocstrings/vba/issues"

[dependency-groups]
lint = ["black>=26.10.1,<27"]
typing = ["mypy>=2.4,<3", "types-Markdown>=3,<4"]
build = ["build>=1,<2", "twine>=6,<7"]
test = ["mkdocs-material>=9.2,<10"]
dev = [
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "build"},
    {include-group = "test"},
]

[tool.setuptools.packages.find]
include = ["mkdocstrings_handlers", "mkdocstrings_handlers.*"]
namespaces = true

[tool.setuptools.package-data]
"mkdocstrings_handlers" = ["py.typed"]
"mkdocstrings_handlers.vba" = ["py.typed", "templates/**/*.html", "templates/**/*.css"]

[tool.setuptools_scm]
version_file = "mkdocstrings_handlers/vba/version.py"

[tool.black]
target-version = ["py39"]
line-length = 88

[tool.mypy]
files = ["mkdocstrings_handlers", "test"]
strict = true
exclude = '^(build|dist|venv)/'
# Keep the shared mkdocstrings_handlers namespace rooted at the repository.
explicit_package_bases = true
# Some dependencies do not maintain __all__.
implicit_reexport = true
